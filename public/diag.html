<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Apex Diagnostic</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #0a0a0d;
        color: #f5f5f5;
        margin: 0;
        padding: 24px 16px;
        line-height: 1.5;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #262630;
        font-size: 14px;
      }
      .label {
        color: #9a9aa6;
      }
      .ok {
        color: #4ade80;
      }
      .bad {
        color: #f87171;
      }
      .pending {
        color: #facc15;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #16161c;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        margin-top: 16px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        border: none;
        background: #f5f5f5;
        color: #0a0a0d;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Apex Diagnostic Page</h1>
    <div class="row"><span class="label">Page JS running</span><span id="jsCheck" class="pending">checking…</span></div>
    <div class="row"><span class="label">Clock (proves JS keeps running)</span><span id="clock" class="pending">0s</span></div>
    <div class="row"><span class="label">Network call to Apex server</span><span id="netStatus" class="pending">not started</span></div>
    <div class="row"><span class="label">Response time</span><span id="netTime">–</span></div>
    <pre id="details">Waiting…</pre>
    <button id="copyBtn" type="button">Copy this report to send to Brad's dev</button>
    <script>
      (function () {
        document.getElementById("jsCheck").textContent = "yes";
        document.getElementById("jsCheck").className = "ok";

        var startedAt = Date.now();
        var seconds = 0;
        var clockEl = document.getElementById("clock");
        setInterval(function () {
          seconds += 1;
          clockEl.textContent = seconds + "s";
        }, 1000);

        var netStatus = document.getElementById("netStatus");
        var netTime = document.getElementById("netTime");
        var details = document.getElementById("details");

        function report(obj) {
          details.textContent = JSON.stringify(obj, null, 2);
        }

        var callStartedAt = Date.now();
        var url = "https://australia-southeast1-apex-detailers.cloudfunctions.net/getPublicBookingConfig";

        var timedOut = false;
        var timeoutId = setTimeout(function () {
          timedOut = true;
          netStatus.textContent = "TIMED OUT (20s)";
          netStatus.className = "bad";
          netTime.textContent = "20000ms+";
          report({
            outcome: "client-side-timeout-20s",
            url: url,
            userAgent: navigator.userAgent,
            connection: navigator.connection
              ? {
                  effectiveType: navigator.connection.effectiveType,
                  downlink: navigator.connection.downlink,
                  rtt: navigator.connection.rtt
                }
              : "unavailable",
            at: new Date().toISOString()
          });
        }, 20000);

        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data: {} })
        })
          .then(function (res) {
            var elapsed = Date.now() - callStartedAt;
            if (timedOut) return;
            clearTimeout(timeoutId);
            netTime.textContent = elapsed + "ms";
            return res.text().then(function (bodyText) {
              var ok = res.ok;
              netStatus.textContent = ok ? "SUCCESS (HTTP " + res.status + ")" : "FAILED (HTTP " + res.status + ")";
              netStatus.className = ok ? "ok" : "bad";
              report({
                outcome: ok ? "success" : "http-error",
                httpStatus: res.status,
                elapsedMs: elapsed,
                bodyPreview: bodyText.slice(0, 300),
                userAgent: navigator.userAgent,
                url: window.location.href,
                at: new Date().toISOString()
              });
            });
          })
          .catch(function (error) {
            var elapsed = Date.now() - callStartedAt;
            if (timedOut) return;
            clearTimeout(timeoutId);
            netStatus.textContent = "NETWORK ERROR";
            netStatus.className = "bad";
            netTime.textContent = elapsed + "ms";
            report({
              outcome: "fetch-rejected",
              elapsedMs: elapsed,
              errorName: error && error.name,
              errorMessage: error && error.message,
              userAgent: navigator.userAgent,
              url: window.location.href,
              at: new Date().toISOString()
            });
          });

        document.getElementById("copyBtn").addEventListener("click", function () {
          var text = "JS running: " + document.getElementById("jsCheck").textContent + "\n" +
            "Clock: " + clockEl.textContent + "\n" +
            "Network: " + netStatus.textContent + "\n" +
            "Time: " + netTime.textContent + "\n" +
            "Details:\n" + details.textContent;
          navigator.clipboard.writeText(text).then(
            function () {
              alert("Copied. Paste it to Brad.");
            },
            function () {
              alert(text);
            }
          );
        });
      })();
    </script>
  </body>
</html>
