name: Patch Existing Launch Backend

on:
  push:
    branches:
      - launch-hardening-2026-08
    paths:
      - ".github/workflows/patch-existing-launch-backend.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-hardening-2026-08

      - name: Add final HQ launch features
        run: python scripts/patch-hq-launch-features.py

      - name: Validate full app
        run: npm install && npm run check

      - name: Commit HQ launch features
        run: |
          git config user.name "BradApexNZ"
          git config user.email "brad@apexdetailers.co.nz"
          git add src/hq-v6.jsx
          git commit -m "Finish mobile customer quote and follow-up launch UX"
          git push origin HEAD:launch-hardening-2026-08
