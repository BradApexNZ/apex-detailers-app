name: Launch Reliability Hardening

on:
  push:
    branches:
      - prelaunch-professional-cleanup
    paths:
      - ".github/workflows/phase1-hardening.yml"
      - "scripts/apply-launch-hardening.mjs"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launch candidate
        uses: actions/checkout@v4
        with:
          ref: prelaunch-professional-cleanup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply reliability fixes
        run: node scripts/apply-launch-hardening.mjs

      - name: Validate app build
        run: npm install && npm run build

      - name: Run launch verification
        run: npm run verify

      - name: Validate Functions
        working-directory: functions
        run: npm install && npm run lint

      - name: Commit hardened launch candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hq-v6.jsx functions/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden launch-critical owner and quote workflows"
          git push origin HEAD:prelaunch-professional-cleanup
