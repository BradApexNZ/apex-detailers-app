name: Deploy Apex V6 Preview Functions

on:
  push:
    branches:
      - launch-hardening-2026-08
    paths:
      - "functions/launch-v6.js"
      - "functions/calendar-settings-v6.js"
      - "functions/public-config-v6.js"
      - "functions/entry.js"
      - "functions/package.json"
      - ".github/workflows/deploy-v6-preview-functions.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-v6-preview-functions
  cancel-in-progress: true

jobs:
  deploy-v6:
    name: Deploy isolated V6 functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Google secrets exist
        run: |
          set -e
          for secret in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY; do
            gcloud secrets describe "$secret" --project=apex-detailers >/dev/null
          done

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Validate Functions source
        working-directory: functions
        run: npm run lint

      - name: Deploy V6 functions only
        run: >-
          npx firebase-tools@latest deploy
          --only functions:getPublicBookingConfigLaunch,functions:listBookingAvailabilityV6,functions:submitBookingRequestV6,functions:approveBookingRequestV6,functions:declineBookingRequestV6,functions:createManualBookingV6,functions:syncJobToCalendarV6,functions:getCalendarHealthV6,functions:listGoogleCalendarsV6,functions:saveGoogleCalendarSelectionV6
          --project apex-detailers
          --non-interactive
