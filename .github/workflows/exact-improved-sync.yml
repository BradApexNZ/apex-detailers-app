name: Exact improved bundle sync

on:
  push:
    branches: [main]
    paths:
      - '.sync/**'
      - '.github/workflows/exact-improved-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact improved files
        shell: bash
        run: |
          set -euo pipefail
          decode() { base64 -d "$1" | gzip -dc > "$2"; }
          decode .sync/hq-app.css.gz.b64 src/hq-app.css
          decode .sync/hq-v6.jsx.gz.b64 src/hq-v6.jsx
          decode .sync/booking.jsx.gz.b64 src/booking.jsx
          decode .sync/vite.config.js.gz.b64 vite.config.js
          decode .sync/launch-audit.mjs.gz.b64 scripts/launch-audit.mjs
          decode .sync/functions-package.json.gz.b64 functions/package.json
          git show 2d7911268050365628fad5c99aedad46f52ae936:functions/calendar-settings-v6.js > functions/calendar-settings-v6.js

      - name: Remove files absent from improved bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            src/hq-premium-mobile.css \
            src/hq-lock-screen.css \
            src/booking-showcase.css \
            src/apex-v31.css \
            src/hq-v5.css \
            src/hq-notifications.css \
            src/hq-lock-polish.css \
            src/hq-mobile-fixes.css \
            src/customer-importer.js \
            src/booking-live-pricing.css \
            src/hq-v6.css \
            src/hq-auth-polish.css \
            src/hq-v6-mobile-menu.js \
            src/gui-modern.css \
            src/hq-production.css \
            src/public-booking.css \
            src/hq-launch-shell.css \
            src/public-booking.jsx \
            src/hnry-command.css \
            src/hq-booking-controls.css \
            src/apex-brand-assets.css \
            src/hq-launch-final.css \
            src/hq-launch-enhancements.css \
            src/booking-polish.css \
            src/booking.css \
            src/hq-nav-polish.css \
            src/hq-final-polish.css \
            src/hq-mobile-dock-fix.css \
            functions/booking-only.js \
            src/hq-app-core.css \
            src/hq-app-modules.css \
            src/hq-app-responsive.css \
            src/_sync-test.txt

      - name: Verify exact ZIP hashes
        shell: bash
        run: |
          set -euo pipefail
          check() { actual=$(git hash-object "$1"); test "$actual" = "$2" || { echo "HASH MISMATCH $1 expected=$2 actual=$actual"; exit 1; }; }
          check hq.html 9e2539b650c83bc39cba54470d872700ab4cf955
          check booking.html 244df999d630dc58fe5cfa4fcf75019ac6f88bcf
          check vite.config.js fa26d0521f9d4240ad1e95ece4d5a83ffac6644b
          check scripts/launch-audit.mjs 4416c8c4eb16c39b7f360b679daaef9ceab8ca99
          check src/apex-theme.css 5d82f5329f561b46ca026cd9724feedc24a7a3e3
          check src/booking-app.css b76f749c118fb8396dbc268a1c3c558c939a70ec
          check src/hq-app.css 0a5ef212088cf78c57e3b04c7e29771f6b54e3d3
          check src/hq-v6.jsx 1b0f86083396b7220a81d11bc4da44ee1435ad80
          check src/booking.jsx e477b4dc880aa15bcf5fd1ee07009776582fbf52
          check src/apex-api.js 44b090e6531e2f27ededfca8722e0dbf3fa5c75b
          check functions/package.json 6b08eceaacb0febe963c559191fbddba8931788d
          check functions/calendar-settings-v6.js 5333327f92ce2f78fb4e1818a1e4eea9221ca5b6
          node scripts/launch-audit.mjs

      - name: Commit exact improved source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/exact-improved-sync.yml
          git config user.name "Apex Exact Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Sync exact improved Apex bundle"
          git push origin HEAD:main
