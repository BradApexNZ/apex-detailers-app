name: Deploy Firestore Rules Direct

on:
  push:
    branches:
      - launch-hardening-2026-08
    paths:
      - "firestore.v5.rules"
      - ".github/workflows/deploy-firestore-rules-rest.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-firestore-rules-direct
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com

      - name: Create validated ruleset and release it
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          python - <<'PY' > /tmp/ruleset.json
          import json
          from pathlib import Path
          print(json.dumps({
            "source": {
              "files": [{
                "name": "firestore.rules",
                "content": Path("firestore.v5.rules").read_text()
              }]
            }
          }))
          PY

          HTTP_CODE=$(curl -sS -o /tmp/ruleset-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ruleset.json \
            "https://firebaserules.googleapis.com/v1/projects/apex-detailers/rulesets")
          cat /tmp/ruleset-response.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300

          RULESET=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/ruleset-response.json'))['name'])
          PY
          )

          python - "$RULESET" <<'PY' > /tmp/release.json
          import json, sys
          ruleset = sys.argv[1]
          print(json.dumps({
            "name": "projects/apex-detailers/releases/cloud.firestore",
            "rulesetName": ruleset
          }))
          PY

          HTTP_CODE=$(curl -sS -o /tmp/release-response.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/release.json \
            "https://firebaserules.googleapis.com/v1/projects/apex-detailers/releases/cloud.firestore?updateMask=rulesetName")
          cat /tmp/release-response.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300

      - name: Confirm active Firestore release
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://firebaserules.googleapis.com/v1/projects/apex-detailers/releases/cloud.firestore"
