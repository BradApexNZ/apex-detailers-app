# Exact improved bundle redeploy trigger
name: Deploy Apex Detailers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-detailers-production
  cancel-in-progress: true

jobs:
  validate-cloud:
    name: Validate Apex Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Validate Functions source
        working-directory: functions
        run: npm run lint

  deploy-hosting:
    name: Deploy Apex Hosting
    needs: validate-cloud
    runs-on: ubuntu-latest
    env:
      VITE_APEX_CLOUD_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Build app with Apex Cloud enabled
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project apex-detailers --non-interactive
