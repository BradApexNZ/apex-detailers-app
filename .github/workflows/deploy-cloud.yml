name: Deploy Apex Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - firestore.v5.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-cloud.yml

permissions:
  contents: read
  id-token: write
concurrency:
  group: apex-detailers-cloud
  cancel-in-progress: true
jobs:
  deploy-cloud:
    name: Deploy Functions and Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether Functions source changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -q '^functions/'; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable required Google APIs
        run: |
          gcloud services enable calendar-json.googleapis.com gmail.googleapis.com cloudfunctions.googleapis.com run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com secretmanager.googleapis.com eventarc.googleapis.com pubsub.googleapis.com iamcredentials.googleapis.com --project=apex-detailers
      - name: Verify required secrets
        run: |
          set -e
          for secret in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY; do
            gcloud secrets describe "$secret" --project=apex-detailers >/dev/null 2>&1 || { echo "Missing Secret Manager secret: $secret"; exit 1; }
          done
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Validate Functions source
        working-directory: functions
        run: npm run lint
      - name: Deploy Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project apex-detailers --non-interactive

      # Launch priority: this existing function now handles Calendar health,
      # live Google event reads and safe cache sync. Deploy it first so Calendar
      # fixes are testable immediately without waiting for the rest of the stack.
      #
      # Both function-deploying steps below are skipped when nothing under
      # functions/ actually changed (e.g. a firebase.json hosting-only tweak) -
      # redeploying all 16 functions unconditionally on every push meant a
      # ~30-minute rollout window on totally unrelated changes, and requests
      # landing on a container mid-rollout were the repeated cause of the
      # public booking page hanging tonight.
      - name: Deploy Calendar gateway first
        if: steps.changes.outputs.functions_changed == 'true'
        run: |
          npx firebase-tools@latest deploy --only "functions:listGoogleCalendarsV6" --project apex-detailers --non-interactive --force
          sleep 8

      - name: Deploy remaining launch-critical Functions sequentially
        if: steps.changes.outputs.functions_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            getPublicBookingConfig
            listBookingAvailability
            listMonthAvailability
            submitBookingRequest
            approveBookingRequest
            declineBookingRequest
            createManualBooking
            syncJobToCalendar
            submitInquiry
            startGoogleCalendarConnect
            googleCalendarCallback
            getGoogleCalendarStatus
            disconnectGoogleCalendar
            importGoogleCalendarEvents
            scanGoogleCalendarProspects
            saveGoogleCalendarProspect
            dismissGoogleCalendarProspect
          )
          for fn in "${functions[@]}"; do
            echo "::group::Deploy $fn"
            # --force: some of these set minInstances, which the CLI otherwise
            # refuses to deploy non-interactively (it wants an interactive
            # confirmation for anything that raises the minimum bill).
            npx firebase-tools@latest deploy --only "functions:${fn}" --project apex-detailers --non-interactive --force
            echo "::endgroup::"
            sleep 8
          done
