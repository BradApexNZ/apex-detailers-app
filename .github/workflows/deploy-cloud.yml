name: Deploy Apex Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - firestore.v5.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-cloud.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-detailers-cloud
  cancel-in-progress: false

jobs:
  deploy-cloud:
    name: Deploy Functions and Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            calendar-json.googleapis.com \
            gmail.googleapis.com \
            cloudfunctions.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            secretmanager.googleapis.com \
            eventarc.googleapis.com \
            pubsub.googleapis.com \
            iamcredentials.googleapis.com \
            --project=apex-detailers

      - name: Verify required secrets
        run: |
          set -e
          for secret in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY; do
            gcloud secrets describe "$secret" --project=apex-detailers >/dev/null 2>&1 || {
              echo "Missing Secret Manager secret: $secret"
              exit 1
            }
          done

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Validate Functions source
        working-directory: functions
        run: npm run lint

      - name: Deploy Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project apex-detailers --non-interactive

      # Firebase deploys every 2nd-gen function in a target concurrently. Apex now has
      # enough functions to exceed the australia-southeast1 regional CPU quota during
      # a full deploy, even though steady-state usage is fine. Keep batches deliberately
      # small so Cloud Run revisions are created within quota.
      - name: Deploy public booking functions
        run: npx firebase-tools@latest deploy --only functions:getPublicBookingConfig,functions:getPublicBookingConfigV6,functions:getPublicBookingConfigLaunch,functions:listBookingAvailability,functions:listBookingAvailabilityV6,functions:submitBookingRequest,functions:submitBookingRequestV6 --project apex-detailers --non-interactive

      - name: Deploy booking management functions
        run: npx firebase-tools@latest deploy --only functions:approveBookingRequest,functions:approveBookingRequestV6,functions:declineBookingRequest,functions:declineBookingRequestV6,functions:createManualBooking,functions:createManualBookingV6,functions:submitInquiry --project apex-detailers --non-interactive

      - name: Deploy Google connection functions
        run: npx firebase-tools@latest deploy --only functions:startGoogleCalendarConnect,functions:googleCalendarCallback,functions:getGoogleCalendarStatus,functions:disconnectGoogleCalendar,functions:listGoogleCalendars,functions:listGoogleCalendarsV6 --project apex-detailers --non-interactive

      - name: Deploy Google calendar management functions
        run: npx firebase-tools@latest deploy --only functions:saveGoogleCalendarSelection,functions:saveGoogleCalendarSelectionV6,functions:importGoogleCalendarEvents,functions:syncJobToCalendar,functions:syncJobToCalendarV6,functions:getCalendarHealthV6 --project apex-detailers --non-interactive

      - name: Deploy Calendar prospect functions
        run: npx firebase-tools@latest deploy --only functions:saveGoogleCalendarProspect,functions:dismissGoogleCalendarProspect,functions:scanGoogleCalendarProspects --project apex-detailers --non-interactive
