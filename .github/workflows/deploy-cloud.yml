name: Deploy Apex Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - firestore.v5.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-cloud.yml

permissions:
  contents: read
  id-token: write
concurrency:
  group: apex-detailers-cloud
  cancel-in-progress: true
jobs:
  deploy-cloud:
    name: Deploy Functions and Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether Functions source changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -q '^functions/'; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable required Google APIs
        run: |
          gcloud services enable calendar-json.googleapis.com gmail.googleapis.com cloudfunctions.googleapis.com run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com secretmanager.googleapis.com eventarc.googleapis.com pubsub.googleapis.com iamcredentials.googleapis.com --project=apex-detailers
      - name: Verify required secrets
        run: |
          set -e
          for secret in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY; do
            gcloud secrets describe "$secret" --project=apex-detailers >/dev/null 2>&1 || { echo "Missing Secret Manager secret: $secret"; exit 1; }
          done
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Validate Functions source
        working-directory: functions
        run: npm run lint
      - name: Deploy Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project apex-detailers --non-interactive

      # Skipped when nothing under functions/ actually changed (e.g. a
      # firebase.json hosting-only tweak) - redeploying all 18 functions
      # unconditionally on every push meant a long rollout window on totally
      # unrelated changes.
      #
      # Deployed in small batches (4 functions per `firebase deploy` call),
      # not 18 fully separate CLI invocations with an 8s sleep after every
      # single one. That one-at-a-time-with-sleep pattern was built on the
      # theory that a request landing on a function mid-rollout caused the
      # booking page hang - that theory turned out to be wrong (the real
      # cause was an infinite render loop in the frontend, unrelated to
      # deploy timing), so it bought nothing beyond the ~144s of pure sleep
      # it cost. Still deliberately NOT one giant combined command for all 18
      # at once, though: Cloud Functions v2 deploys go through Cloud Build,
      # and this project's regional Cloud Build/CPU quota is sized for a
      # handful of concurrent builds, not 18 simultaneous ones - batches of 4
      # stay comfortably inside that regardless of how much internal
      # concurrency a given firebase-tools version uses for a multi-function
      # deploy, while cutting the number of process launches (and their
      # per-invocation startup cost) by more than 4x.
      - name: Deploy launch-critical Functions
        if: steps.changes.outputs.functions_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            listGoogleCalendarsV6
            getPublicBookingConfig
            listBookingAvailability
            listMonthAvailability
            submitBookingRequest
            approveBookingRequest
            declineBookingRequest
            createManualBooking
            syncJobToCalendar
            submitInquiry
            startGoogleCalendarConnect
            googleCalendarCallback
            getGoogleCalendarStatus
            disconnectGoogleCalendar
            importGoogleCalendarEvents
            scanGoogleCalendarProspects
            saveGoogleCalendarProspect
            dismissGoogleCalendarProspect
          )
          batch_size=4
          for ((i = 0; i < ${#functions[@]}; i += batch_size)); do
            batch=("${functions[@]:i:batch_size}")
            targets=$(printf ",functions:%s" "${batch[@]}")
            targets=${targets:1}
            echo "::group::Deploy batch: ${batch[*]}"
            # --force: some of these set minInstances, which the CLI otherwise
            # refuses to deploy non-interactively (it wants an interactive
            # confirmation for anything that raises the minimum bill).
            npx firebase-tools@latest deploy --only "$targets" --project apex-detailers --non-interactive --force
            echo "::endgroup::"
          done
