name: Preview Sync Firestore Rules

on:
  push:
    branches:
      - prelaunch-professional-cleanup
    paths:
      - .github/workflows/preview-sync-firestore-rules.yml
      - firestore.v5.rules
      - firebase.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-preview-firestore-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Firestore rules only
        run: npx firebase-tools@latest deploy --only firestore:rules --project apex-detailers --non-interactive
