name: Apex HQ V5 check

on:
  push:
    branches:
      - agent/apex-hq-v5-booking-overhaul
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all pages
        run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Firestore rules check
        id: rules
        shell: bash
        run: |
          set +e
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-apex-hq "node -e \"console.log('Firestore rules loaded')\"" > firestore-rules-output.txt 2>&1
          result=$?
          echo "$result" > firestore-rules-exit.txt
          cat firestore-rules-output.txt
          exit 0

      - name: Upload Firestore diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-diagnostic
          path: |
            firestore-rules-output.txt
            firestore-rules-exit.txt

      - name: Enforce Firestore rules result
        run: test "$(cat firestore-rules-exit.txt)" = "0"
