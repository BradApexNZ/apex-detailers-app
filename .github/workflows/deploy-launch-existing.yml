name: Deploy Launch Existing Endpoints

on:
  push:
    branches:
      - launch-hardening-2026-08
    paths:
      - "functions/index.js"
      - ".github/workflows/deploy-launch-existing.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: apex-launch-existing-cloud
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Google secrets
        run: |
          set -e
          for secret in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TOKEN_ENCRYPTION_KEY; do
            gcloud secrets describe "$secret" --project=apex-detailers >/dev/null
          done

      - name: Install and validate Functions
        run: npm --prefix functions install && npm --prefix functions run lint

      - name: Deploy final hardened launch endpoints
        run: >-
          npx firebase-tools@latest deploy
          --only functions:getPublicBookingConfig,functions:listBookingAvailability,functions:submitBookingRequest,functions:approveBookingRequest,functions:declineBookingRequest,functions:createManualBooking,functions:getGoogleCalendarStatus,functions:syncJobToCalendar
          --project apex-detailers
          --non-interactive
