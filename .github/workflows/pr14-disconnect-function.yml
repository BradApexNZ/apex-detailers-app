name: PR14 Google Disconnect Function

on:
  push:
    branches:
      - prelaunch-professional-cleanup
    paths:
      - "functions/google-disconnect-v6.js"
      - "functions/entry.js"
      - "functions/package.json"
      - ".github/workflows/pr14-disconnect-function.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: apex-detailers
          workload_identity_provider: projects/845997886809/locations/global/workloadIdentityPools/github-actions/providers/apex-detailers
          service_account: github-deployer@apex-detailers.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Validate Functions
        working-directory: functions
        run: npm run lint
      - name: Deploy disconnect callable only
        run: npx firebase-tools@latest deploy --only functions:disconnectGoogleCalendar --project apex-detailers --non-interactive
