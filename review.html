<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Leave a review | Apex Detailers</title>
    <meta name="description" content="Enjoyed your detail? Leave Apex Detailers a quick Google review." />
    <link rel="canonical" href="https://review.apexdetailers.co.nz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apex Detailers" />
    <meta property="og:url" content="https://review.apexdetailers.co.nz/" />
    <meta property="og:title" content="Leave Apex Detailers a review" />
    <meta property="og:description" content="Enjoyed your detail? A quick Google review helps a local business heaps." />
    <meta property="og:image" content="https://book.apexdetailers.co.nz/apex-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/apex-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/apex-icon-16.png" />
    <link rel="apple-touch-icon" href="/apex-icon-180.png" />
    <link rel="stylesheet" href="/src/apex-theme.css" />
    <style>
      body {
        margin: 0;
        background: radial-gradient(560px 360px at 50% 12%, rgba(232, 185, 58, 0.14), transparent 70%), var(--ink);
        color: var(--paper);
        font-family: var(--body);
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        max-width: 440px;
        margin: 0 auto;
        padding: max(32px, env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        text-align: center;
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--line);
      }
      .eyebrow {
        margin-top: 26px;
      }
      h1 {
        margin: 10px 0 10px;
        font-family: var(--display);
        font-size: clamp(30px, 9vw, 40px);
        line-height: 1.05;
      }
      h1 em {
        color: var(--gold);
        font-style: normal;
      }
      p {
        margin: 0;
        color: var(--paper-dim);
        font-size: 15.5px;
        line-height: 1.55;
      }
      .stars {
        margin: 22px 0 26px;
        color: var(--gold);
        font-size: 30px;
        letter-spacing: 6px;
      }
      .actions {
        display: grid;
        gap: 10px;
        width: 100%;
      }
      .actions a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        border-radius: var(--r-md);
        font-size: 15.5px;
        font-weight: 800;
        text-decoration: none;
      }
      .actions a.secondary {
        border: 1px solid var(--line-strong);
        background: var(--panel-2);
        color: var(--paper);
        font-weight: 700;
      }
      .note {
        margin-top: 18px;
        color: var(--paper-faint);
        font-size: 12.5px;
      }
      footer {
        margin-top: 34px;
        color: var(--paper-faint);
        font-size: 12px;
      }
      footer a {
        color: var(--paper-dim);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/apex-icon-192.png" alt="Apex Detailers" />
      <span class="eyebrow">APEX DETAILERS · HAWKE'S BAY</span>
      <h1>Enjoyed your <em>detail?</em></h1>
      <p>A quick Google review helps a local business heaps — and it only takes a minute. Cheers!</p>
      <div class="stars" aria-hidden="true">★★★★★</div>
      <div class="actions">
        <a class="primary" href="https://search.google.com/local/writereview?placeid=ChIJE98t9L1u-6oRXZN4rOcRBNI">
          Write a Google review
        </a>
        <a class="secondary" href="https://www.google.com/maps/place/?q=place_id:ChIJE98t9L1u-6oRXZN4rOcRBNI">
          Open in Google Maps
        </a>
      </div>
      <p class="note">Google may ask you to sign in to your Google account before posting.</p>
      <footer>Need another detail? <a href="https://book.apexdetailers.co.nz/book">Book online</a></footer>
    </main>
  </body>
</html>
