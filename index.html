<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="apple-mobile-web-app-title" content="Apex HQ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Apex Detailers HQ</title>
    <style>
      :root {
        --apex-glass: rgba(12, 12, 16, 0.78);
        --apex-line: rgba(255, 210, 31, 0.2);
        --apex-line-hot: rgba(255, 210, 31, 0.52);
      }

      body {
        background:
          radial-gradient(circle at 18% -10%, rgba(255, 210, 31, 0.28), transparent 30%),
          radial-gradient(circle at 88% 10%, rgba(255, 179, 0, 0.16), transparent 28%),
          radial-gradient(circle at 50% 110%, rgba(255, 210, 31, 0.1), transparent 32%),
          linear-gradient(180deg, #030304 0%, #101014 45%, #050506 100%) !important;
      }

      .appHeader {
        background: rgba(3, 3, 4, 0.82) !important;
        border-bottom: 1px solid rgba(255, 210, 31, 0.14) !important;
        box-shadow: 0 18px 44px rgba(0,0,0,0.35);
      }

      .brandLogo {
        width: 64px !important;
        height: 52px !important;
        border-radius: 18px !important;
        border-color: rgba(255, 210, 31, 0.72) !important;
        background:
          radial-gradient(circle at 30% 16%, rgba(255,255,255,0.34), transparent 24%),
          linear-gradient(145deg, #262629 0%, #09090b 52%, #251c00 100%) !important;
        box-shadow: 0 18px 54px rgba(255, 210, 31, 0.13), inset 0 0 0 1px rgba(255,255,255,0.08) !important;
      }

      .brandLogo span {
        font-size: 0 !important;
        letter-spacing: 0 !important;
      }

      .brandLogo span::before {
        content: "APEX";
        font-size: 13px;
        font-weight: 1000;
        letter-spacing: 0.08em;
        color: #fff3a3;
        text-shadow: 0 0 18px rgba(255, 210, 31, 0.55);
      }

      .wordmark h1 {
        font-size: 18px !important;
        letter-spacing: 0.14em !important;
      }

      .wordmark p,
      .appHeader p {
        color: #ffd21f !important;
        letter-spacing: 0.18em !important;
      }

      .heroCard {
        min-height: 210px !important;
        border-color: rgba(255, 210, 31, 0.46) !important;
        background:
          linear-gradient(120deg, rgba(255,255,255,0.08), transparent 35%),
          radial-gradient(circle at 14% 8%, rgba(255, 210, 31, 0.25), transparent 36%),
          radial-gradient(circle at 96% 92%, rgba(255, 210, 31, 0.16), transparent 32%),
          linear-gradient(145deg, rgba(31, 31, 37, 0.98), rgba(5, 5, 7, 0.98)) !important;
        box-shadow: 0 28px 80px rgba(0,0,0,0.62), 0 18px 80px rgba(255, 210, 31, 0.08) !important;
      }

      .heroCard h2 {
        max-width: 680px !important;
        font-size: clamp(30px, 8vw, 52px) !important;
      }

      .heroPills span,
      .chips span,
      .warnings span,
      .badge {
        backdrop-filter: blur(14px);
      }

      .card,
      .stat,
      .formPanel,
      .commandCard,
      .emptyState,
      .messageBox,
      .paymentJobCard {
        border-color: rgba(255,255,255,0.11) !important;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.052), transparent 48%),
          linear-gradient(180deg, rgba(20,20,25,0.94), rgba(6,6,9,0.96)) !important;
      }

      .stat {
        min-height: 102px !important;
        border-color: rgba(255, 210, 31, 0.16) !important;
      }

      .stat strong {
        font-size: clamp(26px, 7vw, 40px) !important;
      }

      .actionCard {
        border-color: rgba(255, 210, 31, 0.16) !important;
        background:
          linear-gradient(135deg, rgba(255, 210, 31, 0.13), transparent 42%),
          rgba(255,255,255,0.065) !important;
      }

      .actionCard strong {
        font-size: 19px !important;
      }

      .formPanel h3,
      .cardHeader h3 {
        letter-spacing: -0.03em;
      }

      input,
      select,
      textarea {
        background: rgba(3, 3, 5, 0.82) !important;
        border-color: rgba(255,255,255,0.14) !important;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(255, 210, 31, 0.82) !important;
        box-shadow: 0 0 0 4px rgba(255, 210, 31, 0.12), 0 12px 36px rgba(0,0,0,0.24) !important;
      }

      .paymentJobCard {
        position: relative;
        overflow: hidden;
        margin-bottom: 14px;
        padding: 16px;
        border-radius: var(--radius, 24px);
        box-shadow: var(--shadow, 0 22px 70px rgba(0,0,0,0.58));
      }

      .paymentJobCard::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(120deg, rgba(255,255,255,0.09), transparent 34%),
          radial-gradient(circle at 100% 0%, rgba(255,210,31,0.13), transparent 38%);
      }

      .paymentJobCard > * { position: relative; z-index: 1; }
      .invoiceBrief { margin-top: 12px; }

      .bottomNav {
        grid-template-columns: repeat(6, 1fr) !important;
        border-color: rgba(255, 210, 31, 0.16) !important;
        background: rgba(5, 5, 7, 0.9) !important;
      }

      .bottomNav button {
        min-height: 56px !important;
        font-size: 10px !important;
        border-radius: 16px !important;
      }

      .bottomNav button.active {
        background: linear-gradient(180deg, rgba(255, 210, 31, 0.19), rgba(255, 210, 31, 0.08)) !important;
        box-shadow: inset 0 0 0 1px rgba(255, 210, 31, 0.18);
      }

      .fab {
        border-radius: 24px !important;
        box-shadow: 0 20px 54px rgba(255, 210, 31, 0.34), inset 0 1px 0 rgba(255,255,255,0.45) !important;
      }

      @media (max-width: 390px) {
        .appMain { padding: 12px !important; }
        .brandLogo { width: 56px !important; height: 48px !important; }
        .wordmark h1 { font-size: 15px !important; }
        .bottomNav { left: 6px !important; right: 6px !important; width: calc(100% - 12px) !important; gap: 4px !important; }
        .bottomNav button { font-size: 9px !important; padding-inline: 2px !important; }
        .navIcon { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
