<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="apple-mobile-web-app-title" content="Apex HQ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="refresh" content="0;url=/hq" />
    <title>Apex HQ</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/apex-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/apex-icon-16.png" />
    <link rel="apple-touch-icon" href="/apex-icon-180.png" />
    <script>
      // book.apexdetailers.co.nz exists specifically to be a clean link for
      // Instagram/Facebook bios and stories - it needs to land straight on
      // the booking form, not the HQ redirect every other hostname on this
      // Hosting site gets. The <meta refresh> above is a no-JS fallback and
      // stays pointed at /hq since that path can't be made hostname-aware.
      // admin.apexdetailers.co.nz is the same idea for the owner: it opens the
      // stripped-down /admin approvals app.
      const landing = { "book.apexdetailers.co.nz": "/book", "admin.apexdetailers.co.nz": "/admin" };
      window.location.replace(landing[window.location.hostname] || "/hq");
    </script>
  </head>
  <body>
    <p>Opening <a href="/hq">Apex HQ</a>…</p>
  </body>
</html>
